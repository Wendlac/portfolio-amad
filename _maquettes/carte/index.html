<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte — exploration</title>
<meta name="robots" content="noindex">

<!--
  LA CARTE — version simple, page par page.

  L'accueil ne porte que le héro et une carte de projet. La carte est
  celle d'un lecteur de musique : repliée, un titre, un résumé et deux
  pilules pour changer de projet ; on clique dessus et elle se déplie en
  montrant le visuel, le détail, l'année, le rôle et le lien vers le
  projet réel.

  Les valeurs relevées sur les deux maquettes sont en tête de
  assets/carte.css, les projets dans assets/carte.js et nulle part
  ailleurs. Les icônes sont celles de Phosphor, tracés d'origine.
-->

<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/carte.css">
</head>
<body>

<main class="page">
  <button class="pilule" id="pilule" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
  <p class="kicker">Hello, c&rsquo;est Amad Louis</p>
  <h1 class="titre">Le design partner de vos projets d&rsquo;applications m&eacute;tier</h1>

  <section class="zone-carte" aria-label="Projets">
    <article class="carte" id="carte" data-ouverte="false">

      <!-- toute la carte repliée est la commande -->
      <button class="carte__declencheur" id="c-declencheur" type="button"></button>

      <button class="carte__fermer" id="c-fermer" type="button" aria-label="Replier la carte"></button>

      <div class="carte__image">
        <img id="c-image" src="" alt="">
      </div>

      <div class="carte__texte">
        <h2 class="carte__titre" id="c-titre"></h2>
        <!--
          Le résumé et les deux pilules ne servent que carte repliée : une
          fois dépliée, c'est le détail qui parle. Ils se replient donc
          ensemble, et c'est ce qui fait tomber la hauteur dépliée sur
          celle de la maquette.
        -->
        <div class="carte__teaser"><div>
          <p class="carte__resume" id="c-resume"></p>

          <div class="carte__nav">
            <button class="nav-pilule" type="button" data-pas="-1">
              <span class="ic"></span>Projet pr&eacute;c&eacute;dent
            </button>
            <button class="nav-pilule" type="button" data-pas="1">
              Prochain projet<span class="ic"></span>
            </button>
          </div>
        </div></div>

        <div class="carte__detail">
          <div>
            <h3 class="detail__sous-titre">C&rsquo;est quoi le projet?</h3>
            <p class="detail__texte" id="c-texte"></p>
            <ul class="meta" id="c-meta"></ul>
          </div>
        </div>
      </div>

      <a class="carte__cta" id="c-cta" href="#"></a>
    </article>

    <!-- la carte qui dépasse derrière, repliée seulement -->
    <div class="dos" aria-hidden="true"></div>

    <p class="sr-only" aria-live="polite" id="c-etat"></p>
  </section>
</main>

<nav class="menu" id="menu" aria-label="Navigation principale">
  <a href="#projets">Mes projets</a>
  <a href="#lectures">Mes lectures</a>
  <a href="#profil">Qui suis je?</a>
</nav>

<script src="assets/carte.js"></script>
</body>
</html>
