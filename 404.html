<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable - Amad Louis</title>
<meta name="robots" content="noindex">

<!--
  GitHub Pages sert ce fichier pour toute adresse inconnue, avec un vrai
  code 404.

  Elle emprunte la feuille de style de l'accueil plutôt que d'en avoir une :
  même colonne, même typo, mêmes couleurs, et le lien hérite de la pastille
  au survol sans qu'une ligne soit à écrire. Une page d'erreur qui dérive de
  la charte est une page d'erreur qu'on oublie de tenir à jour.

  Pas de wall.js : il remplit #projets, #parcours, #livres et #liens, qui
  n'existent pas ici, et il s'arrêterait sur la première. Donc pas non plus
  le drapeau .anime, qui n'a de sens qu'avec lui.
-->

<link rel="icon" type="image/svg+xml" href="/assets/img/favicon/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicon/apple-touch-icon.png">

<link rel="stylesheet" href="/assets/wall/fonts.css?v=2026-10-08">
<link rel="stylesheet" href="/assets/wall/wall.css?v=2026-10-08">

<style>
  /* La seule règle propre à cette page : l'écart entre le chapeau et le
     lien. Elle ne va pas dans wall.css, qui ne servirait qu'ici. */
  .retour { margin-top: 32px; }
</style>
</head>
<body>

<main class="page">

  <img class="avatar" src="/assets/img/wall/avatar.svg" alt="" width="58" height="70">

  <h1 class="salut">Cette page n&rsquo;existe pas</h1>

  <p class="chapeau">
    Elle a peut-&ecirc;tre chang&eacute; d&rsquo;adresse, ou disparu avec une version
    pr&eacute;c&eacute;dente du site. Rien n&rsquo;est perdu&nbsp;: tout ce que je montre tient
    d&eacute;sormais sur une seule page.
  </p>

  <!-- dans .prose pour hériter du survol en pastille, comme partout ailleurs -->
  <div class="prose retour">
    <p><a class="a-cyan" href="/">Retourner &agrave; l&rsquo;accueil</a></p>
  </div>

</main>

</body>
</html>
